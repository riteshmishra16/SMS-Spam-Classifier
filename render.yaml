services:
  - type: web
    name: sms-spam-classifier
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader punkt punkt_tab stopwords
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
